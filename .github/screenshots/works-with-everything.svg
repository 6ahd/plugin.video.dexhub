<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="1" stop-color="#151026"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="flowL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33d8f7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="flowR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="820" rx="36" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="330" fill="url(#glow)"/>

  <text x="800" y="86" text-anchor="middle" fill="#ffffff" font-size="46" font-weight="800">Any source in. Any skin out.</text>
  <text x="800" y="132" text-anchor="middle" fill="#a1a1b5" font-size="24">Dex Hub sits between what you watch from and where you watch it, and fits with both.</text>

  <!-- left column: sources -->
  <text x="80" y="208" fill="#33d8f7" font-size="20" font-weight="700" letter-spacing="3">YOUR SOURCES</text>
  <g font-size="23" fill="#ffffff">
    <rect x="70" y="232" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="100" y="270" font-weight="700">Any Stremio or Nuvio add-on</text>
    <text x="100" y="303" fill="#a1a1b5" font-size="19">Paste a link: Torrentio, AIOStreams, Comet…</text>

    <rect x="70" y="342" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="100" y="380" font-weight="700">Your own servers</text>
    <text x="100" y="413" fill="#a1a1b5" font-size="19">Plex · Emby · Jellyfin · Silo</text>

    <rect x="70" y="452" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="100" y="490" font-weight="700">Live TV</text>
    <text x="100" y="523" fill="#a1a1b5" font-size="19">Xtream Codes · M3U playlists · guide</text>

    <rect x="70" y="562" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="100" y="600" font-weight="700">Your accounts</text>
    <text x="100" y="633" fill="#a1a1b5" font-size="19">Trakt · Simkl · MDBList · Nuvio sync</text>
  </g>

  <!-- flows in -->
  <g fill="none" stroke="url(#flowL)" stroke-width="3">
    <path d="M530 278 C 600 278, 600 420, 650 440"/>
    <path d="M530 388 C 590 388, 600 430, 650 446"/>
    <path d="M530 498 C 590 498, 600 462, 650 454"/>
    <path d="M530 608 C 600 608, 600 470, 650 460"/>
  </g>

  <!-- core -->
  <rect x="650" y="300" width="300" height="300" rx="64" fill="url(#core)"/>
  <rect x="650" y="300" width="300" height="300" rx="64" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <g transform="translate(800 400)" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round">
    <path d="M-12 0 C -12 -34, -70 -34, -70 0 C -70 34, -12 34, -12 0 Z"/>
    <path d="M12 0 C 12 -34, 70 -34, 70 0 C 70 34, 12 34, 12 0 Z"/>
  </g>
  <text x="800" y="485" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800">Dex Hub</text>
  <text x="800" y="522" text-anchor="middle" fill="#ede9fe" font-size="20">one search · one picker</text>
  <text x="800" y="550" text-anchor="middle" fill="#ede9fe" font-size="20">first results in a second</text>

  <!-- flows out -->
  <g fill="none" stroke="url(#flowR)" stroke-width="3">
    <path d="M950 440 C 1000 420, 1000 278, 1070 278"/>
    <path d="M950 446 C 1010 430, 1000 388, 1070 388"/>
    <path d="M950 454 C 1010 462, 1000 498, 1070 498"/>
    <path d="M950 460 C 1000 470, 1000 608, 1070 608"/>
  </g>

  <!-- right column: where you watch -->
  <text x="1080" y="208" fill="#ffd23f" font-size="20" font-weight="700" letter-spacing="3">WHERE YOU WATCH</text>
  <g font-size="23" fill="#ffffff">
    <rect x="1070" y="232" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1100" y="270" font-weight="700">The Dex Hub skin</text>
    <text x="1100" y="303" fill="#a1a1b5" font-size="19">Optional, made for it, Apple TV style</text>

    <rect x="1070" y="342" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1100" y="380" font-weight="700">Any other skin</text>
    <text x="1100" y="413" fill="#a1a1b5" font-size="19">Dex Hub brings its own Home with it</text>

    <rect x="1070" y="452" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1100" y="490" font-weight="700">Arctic Fuse 3</text>
    <text x="1100" y="523" fill="#a1a1b5" font-size="19">Its Home and pages, in one tap</text>

    <rect x="1070" y="562" width="460" height="92" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1100" y="600" font-weight="700">Your skin's widgets</text>
    <text x="1100" y="633" fill="#a1a1b5" font-size="19">TMDb Helper player · context menu</text>
  </g>

  <text x="800" y="740" text-anchor="middle" fill="#a1a1b5" font-size="21">Kodi 21 Omega and 22 Piers · Android, Fire TV, CoreELEC, LibreELEC, Windows, macOS, Linux · Arabic and English</text>
</svg>
